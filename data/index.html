<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>短信转发器 — 配置</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:#f5f5f5;color:#1e1e1e;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:540px;margin:0 auto;padding:0 16px 40px}

/* Header */
.hdr{padding:28px 0 20px}
.hdr h1{font-size:20px;font-weight:600;letter-spacing:-.3px}
.hdr p{font-size:12px;color:#999;margin-top:2px}

/* Tab bar */
.tabs{display:flex;gap:0;background:#fff;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;margin-bottom:20px}
.tab{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:500;color:#999;cursor:pointer;border:none;background:none;transition:all .15s}
.tab:not(:last-child){border-right:1px solid #e5e5e5}
.tab.act{color:#1a73e8;background:#f0f6ff;font-weight:600}
.tab:hover:not(.act){background:#fafafa}

/* Panels */
.panel{display:none}
.panel.vis{display:block}

/* Cards */
.card{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:16px 18px;margin-bottom:14px}
.card-title{font-size:14px;font-weight:600;color:#1e1e1e;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #f0f0f0}

/* Form */
.fg{margin-bottom:12px}
.fg:last-child{margin-bottom:0}
label.lbl{display:block;font-size:12px;font-weight:500;color:#666;margin-bottom:4px}
input[type="text"],input[type="password"],input[type="number"],textarea,select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;background:#fff;color:#1e1e1e;transition:border-color .15s;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:none;border-color:#1a73e8}
textarea{resize:vertical;min-height:72px}
.hint{font-size:11px;color:#999;margin-top:3px}
input[type="checkbox"]{-webkit-appearance:none;appearance:none;width:36px;height:20px;background:#ccc;border-radius:10px;cursor:pointer;transition:background .2s;flex-shrink:0;vertical-align:middle;position:relative;border:none}
input[type="checkbox"]::before{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
input[type="checkbox"]:checked{background:#1a73e8}
input[type="checkbox"]:checked::before{left:18px}
label.chk{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:400;color:#1e1e1e;margin-bottom:10px}
label.chk:last-child{margin-bottom:0}

/* Buttons */
.btn{display:block;width:100%;padding:10px;border:none;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;font-family:inherit}
.btn-p{background:#1a73e8;color:#fff}
.btn-p:hover{background:#1557b0}
.btn-p:disabled{background:#ccc;cursor:not-allowed}
.btn-s{background:#fff;color:#1e1e1e;border:1px solid #ddd}
.btn-s:hover{background:#f5f5f5}
.btn-d{background:#fff;color:#d32f2f;border:1px solid #f5c6cb}
.btn-d:hover{background:#fff5f5}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{flex:1}

/* Result */
.res{border-radius:6px;padding:8px 12px;font-size:12px;margin-top:10px;display:none}
.res.ok{display:block;background:#e8f5e9;color:#2e7d32;border:1px solid #c8e6c9}
.res.err{display:block;background:#ffebee;color:#c62828;border:1px solid #f5c6cb}

/* Status bar */
.status{background:#fff;border:1px solid #e5e5e5;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#666;display:flex;align-items:center;gap:6px}
.status strong{color:#1e1e1e;font-weight:600}

/* Push channels */
.pch{border:1px solid #e5e5e5;border-radius:6px;padding:12px;margin-bottom:10px;background:#fafafa;transition:border-color .15s}
.pch.on{border-color:#a5d6a7;background:#f6fbf6}
.pch-hdr{display:flex;align-items:center;gap:8px;margin-bottom:0;cursor:pointer}
.pch-hdr label.chk{margin:0;flex:1}
.pch-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;transition:color .15s}
.pch-del:hover{color:#d32f2f}
.pch-body{display:none;margin-top:12px;padding-top:12px;border-top:1px solid #eee}
.pch.on .pch-body{display:block}
.type-hint{font-size:11px;color:#555;margin-top:6px;padding:8px 10px;background:#f0f0f0;border-radius:4px}

/* Strategy */
.seg{display:flex;gap:0;background:#fff;border:1px solid #ddd;border-radius:6px;overflow:hidden}
.seg label{flex:1;padding:7px 0;text-align:center;font-size:12px;font-weight:500;color:#666;cursor:pointer;transition:all .15s;border:none;background:none}
.seg label:not(:last-child){border-right:1px solid #ddd}
.seg input{display:none}
.seg label.act{background:#1a73e8;color:#fff;font-weight:600}

/* List items */
.list-item{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f8f8f8;border:1px solid #eee;border-radius:6px;margin-bottom:6px}
.list-item span{flex:1;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
.list-item button{background:none;border:none;color:#ccc;cursor:pointer;font-size:14px;padding:2px 4px}
.list-item button:hover{color:#d32f2f}
.list-add{display:flex;gap:8px}
.list-add input{flex:1}
.list-add button{width:auto;padding:8px 14px;flex-shrink:0}

/* Reboot mode toggle */
.mode-opts{display:flex;gap:16px;margin:8px 0}
.mode-opts label{font-size:13px;font-weight:400;display:flex;align-items:center;gap:4px;color:#1e1e1e}
.mode-opts input[type="radio"]{width:auto;margin:0}

/* Responsive */
@media(max-width:360px){
  .tabs{flex-wrap:wrap}
  .tab{flex:1 1 50%}
  .tab:nth-child(2){border-right:none}
}
</style>
</head>
<body>
<div class="wrap">

<div class="hdr">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div><h1>短信转发器</h1><p>System Configuration</p></div>
    <a href="/tools" style="font-size:12px;color:#1a73e8;text-decoration:none;padding:6px 12px;border:1px solid #1a73e8;border-radius:4px">工具</a>
  </div>
</div>

<div class="status">设备 IP: <strong id="devIp">--</strong></div>

<div class="tabs" id="tabBar">
  <button class="tab act" data-t="general">常规</button>
  <button class="tab" data-t="notify">推送</button>
  <button class="tab" data-t="network">网络</button>
  <button class="tab" data-t="advanced">高级</button>
</div>

<div id="errorBox" style="display:none;background:#ffebee;color:#c62828;border:1px solid #f5c6cb;border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px">
  <span id="errorMsg"></span>
  <button onclick="loadAll()" style="margin-top:6px;background:#1a73e8;color:#fff;border:none;padding:6px 14px;border-radius:4px;font-size:12px;cursor:pointer">重试</button>
</div>
<div id="loadingMsg" style="text-align:center;padding:40px 0;color:#999;font-size:13px">正在加载配置...</div>

<form id="configForm" onsubmit="saveGeneral(event)">

<!-- Tab: General -->
<div class="panel vis" data-panel="general">
  <div class="card">
    <div class="card-title">管理账号</div>
    <div class="hint" style="margin-bottom:12px;background:#fff8e1;padding:8px 10px;border-radius:4px;color:#e65100;border:1px solid #ffe0b2">首次使用请修改默认密码 (admin / admin123)</div>
    <div class="fg"><label class="lbl">用户名</label><input type="text" name="webUser" id="webUser" placeholder="admin"></div>
    <div class="fg"><label class="lbl">密码 (留空不修改)</label><input type="password" name="webPass" placeholder="设置密码"></div>
  </div>
  <div class="card">
    <div class="card-title">设备信息</div>
    <div class="fg"><label class="lbl">管理员手机号</label><input type="text" name="adminPhone" id="adminPhone" placeholder="13800138000"></div>
    <div class="fg"><label class="lbl">设备备注</label><input type="text" name="remark" id="remark" maxlength="64" placeholder="可选，用于区分多台设备"></div>
    <div style="margin-top:12px">
      <label class="chk"><input type="checkbox" name="simNotifyEnabled" id="simNotifyEnabled"> SIM 卡事件通知</label>
      <label class="chk"><input type="checkbox" name="dataTraffic" id="dataTrafficEnabled"> 启用数据流量</label>
      <label class="chk"><input type="checkbox" name="logFileEnabled" id="logFileEnabled"> 写入日志文件</label>
    </div>
  </div>
  <button type="submit" class="btn btn-p" id="saveBtn">保存配置</button>
  <div id="saveResult" class="res"></div>
</div>

<!-- Tab: Notifications -->
<div class="panel" data-panel="notify">
  <div class="card">
    <div class="card-title">推送策略</div>
    <div class="hint" style="margin-bottom:10px">广播: 同时发送所有通道; 故障转移: 按顺序尝试直到成功</div>
    <div class="seg" id="strategySeg">
      <label class="act"><input type="radio" name="pushStrategy" value="0" checked>广播</label>
      <label><input type="radio" name="pushStrategy" value="1">故障转移</label>
    </div>
  </div>
  <div class="card">
    <div class="card-title">推送通道</div>
    <div id="pushChannels"></div>
    <button type="button" onclick="addPushChannel()" class="btn btn-s" id="addPushBtn" style="margin-top:4px">添加通道</button>
  </div>
</div>

</form>

<!-- Tab: Network -->
<div class="panel" data-panel="network">
  <div class="card">
    <div class="card-title">WiFi 设置</div>
    <div class="hint" style="margin-bottom:12px">最多 5 条，保存后设备自动重启连接新网络</div>
    <div id="wifiList"></div>
    <div class="btn-row" style="margin-top:8px">
      <button onclick="addWifi()" class="btn btn-s" id="addWifiBtn">添加 WiFi</button>
      <button onclick="saveWifi()" class="btn btn-p">保存并重启</button>
    </div>
    <div id="wifiResult" class="res"></div>
  </div>
</div>

<!-- Tab: Advanced -->
<div class="panel" data-panel="advanced">
  <div class="card">
    <div class="card-title">黑名单</div>
    <div class="hint" style="margin-bottom:10px">来自黑名单号码的短信和来电将被忽略 (最多 20 个)</div>
    <div id="blacklistItems" style="margin-bottom:10px"></div>
    <div class="list-add"><input type="text" id="newBlNum" placeholder="输入号码"><button onclick="addBlackNum()" class="btn btn-s">添加</button></div>
    <button onclick="saveBlacklist()" class="btn btn-p" style="margin-top:10px">保存黑名单</button>
    <div id="blacklistResult" class="res"></div>
  </div>
  <div class="card">
    <div class="card-title">定时重启</div>
    <label class="chk"><input type="checkbox" id="rbEnabled"> 启用定时重启</label>
    <div class="fg"><label class="lbl">重启模式</label>
      <div class="mode-opts">
        <label><input type="radio" name="rbMode" value="0" id="rbModeDaily" checked onchange="toggleRbMode()"> 每日定时</label>
        <label><input type="radio" name="rbMode" value="1" id="rbModeInterval" onchange="toggleRbMode()"> 按间隔</label>
      </div>
    </div>
    <div id="rbDailyGroup" class="fg">
      <label class="lbl">重启时间</label>
      <div style="display:flex;gap:8px;align-items:center"><input type="number" id="rbHour" min="0" max="23" value="3" style="width:70px"><span style="font-size:12px;color:#666">时</span><input type="number" id="rbMinute" min="0" max="59" value="0" style="width:70px"><span style="font-size:12px;color:#666">分</span></div>
      <div class="hint">需要 NTP 时间同步</div>
    </div>
    <div id="rbIntervalGroup" class="fg" style="display:none">
      <label class="lbl">间隔 (1 ~ 168 小时)</label>
      <input type="number" id="rbIntervalH" min="1" max="168" value="24" style="width:100px">
      <div class="hint">从上电开始计时</div>
    </div>
    <button onclick="saveReboot()" class="btn btn-p" id="rbSaveBtn">保存定时重启</button>
    <div id="rbResult" class="res"></div>
  </div>
</div>

</div>

<script>
var TYPES={0:"未启用",1:"POST JSON",2:"Bark",3:"GET 请求",4:"钉钉",5:"PushPlus",6:"Server酱",7:"POST 文本",8:"飞书",9:"Gotify",10:"Telegram",11:"企业微信",12:"SMS 短信"};
var HINTS={1:"POST JSON 发送 {sender, message, timestamp}",2:"POST {title, body} 到 Bark 推送地址",3:"GET 请求，参数: sender, message",4:"填写 Webhook 地址，可选签名密钥",5:"填写 PushPlus Token",6:"填写 Server酱 SendKey",7:"POST 自定义格式文本",8:"填写飞书 Webhook，可选签名密钥",9:"填写 Gotify 服务器地址和 Token",10:"需要 Chat ID 和 Bot Token",11:"填写企业微信 Webhook，可选签名密钥",12:"通过短信转发到指定号码"};
var g_chs=[],g_wifis=[],g_bl=[],g_avail=null,g_adminPhone="";

/* --- Tabs --- */
document.getElementById("tabBar").addEventListener("click",function(e){
  var btn=e.target.closest(".tab");if(!btn)return;
  document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("act")});
  btn.classList.add("act");
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("vis")});
  document.querySelector('[data-panel="'+btn.dataset.t+'"]').classList.add("vis");
});

/* --- Strategy segmented --- */
document.getElementById("strategySeg").addEventListener("click",function(e){
  var lbl=e.target.closest("label");if(!lbl)return;
  this.querySelectorAll("label").forEach(function(l){l.classList.remove("act")});
  lbl.classList.add("act");
  lbl.querySelector("input").checked=true;
});

/* --- Helpers --- */
function showRes(id,ok,msg){var el=document.getElementById(id);el.className="res "+(ok?"ok":"err");el.textContent=(ok?"":"错误: ")+msg}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

/* --- Push Channels --- */
function chHtml(ch,idx){
  var en=ch.enabled,on=en?" on":"",opts="";
  for(var t=0;t<=12;t++){
    var avail=(t===0)||(g_avail&&g_avail.indexOf(t)>=0);
    var cur=(ch.type===t);
    if(avail||cur) opts+='<option value="'+t+'"'+(cur?" selected":"")+">"+TYPES[t]+(avail?"":" *")+"</option>";
  }
  var body='<div class="pch'+on+'" data-i="'+idx+'"><div class="pch-hdr"><label class="chk"><input type="checkbox"'+(en?" checked":"")+' onchange="togCh(this)"> 通道 '+(idx+1)+(ch.name?": "+esc(ch.name):"")+'</label><button type="button" class="pch-del" onclick="delCh('+idx+')" title="删除">&times;</button></div><div class="pch-body"><div class="fg"><label class="lbl">名称</label><input type="text" value="'+esc(ch.name)+'" data-k="name"></div><div class="fg"><label class="lbl">类型</label><select data-k="type" onchange="updHint(this)">'+opts+'</select><div class="type-hint" data-k="hint">'+(HINTS[ch.type]||"")+'</div></div><div class="fg" data-k="urlG"><label class="lbl" data-k="urlL">URL</label><input type="text" value="'+esc(ch.url)+'" data-k="url" placeholder="https://..."></div><div class="fg" data-k="k1G" style="display:none"><label class="lbl" data-k="k1L">参数 1</label><input type="text" value="'+esc(ch.key1)+'" data-k="k1"></div><div class="fg" data-k="k2G" style="display:none"><label class="lbl" data-k="k2L">参数 2</label><input type="text" value="'+esc(ch.key2)+'" data-k="k2"></div><div class="fg"><label class="lbl">自定义格式</label><textarea data-k="body" maxlength="512">'+esc(ch.customBody)+'</textarea><div class="hint">留空使用默认格式，可用占位符: {from} {to} {message_content} {date} ...</div></div><label class="chk"><input type="checkbox"'+(ch.retryOnFail?" checked":"")+' data-k="retry"> 失败时重试</label></div></div>';
  return body;
}
function renderChs(){var c=document.getElementById("pushChannels");c.innerHTML="";for(var i=0;i<g_chs.length;i++)c.insertAdjacentHTML("beforeend",chHtml(g_chs[i],i));for(var i=0;i<g_chs.length;i++)updFields(i);document.getElementById("addPushBtn").disabled=g_chs.length>=10}
function togCh(cb){var p=cb.closest(".pch");if(cb.checked)p.classList.add("on");else p.classList.remove("on")}
function getChVal(i,k){var el=document.querySelector('.pch[data-i="'+i+'"] [data-k="'+k+'"]');return el?(el.type==="checkbox"?el.checked:el.value):""}
function setChVal(i,k,v){var el=document.querySelector('.pch[data-i="'+i+'"] [data-k="'+k+'"]');if(el){if(el.type==="checkbox")el.checked=v;else el.value=v}}
function readCh(i){return{enabled:!!getChVal(i,"en"),type:parseInt(getChVal(i,"type")||"1"),name:getChVal(i,"name"),url:getChVal(i,"url"),key1:getChVal(i,"k1"),key2:getChVal(i,"k2"),customBody:getChVal(i,"body"),retryOnFail:!!getChVal(i,"retry")}}
function readChs(){var arr=[];for(var i=0;i<g_chs.length;i++)try{arr.push(readCh(i))}catch(e){arr.push(g_chs[i])}return arr}
function addPushChannel(){g_chs=readChs();if(g_chs.length>=10)return;var def=g_avail&&g_avail.length?g_avail[0]:1;g_chs.push({enabled:false,type:def,name:"",url:"",key1:"",key2:"",customBody:"",retryOnFail:false});renderChs()}
function delCh(idx){if(g_chs.length<=1)return;g_chs=readChs();g_chs.splice(idx,1);renderChs()}
function updHint(sel){var p=sel.closest(".pch"),i=parseInt(p.dataset.i),t=parseInt(sel.value);p.querySelector('[data-k="hint"]').textContent=HINTS[t]||"";updFields(i)}
function updFields(i){
  var t=parseInt(getChVal(i,"type")||"1"),p=document.querySelector('.pch[data-i="'+i+'"]');
  var k1G=p.querySelector('[data-k="k1G"]'),k2G=p.querySelector('[data-k="k2G"]');
  var k1L=p.querySelector('[data-k="k1L"]'),k2L=p.querySelector('[data-k="k2L"]');
  var urlL=p.querySelector('[data-k="urlL"]'),urlI=p.querySelector('[data-k="url"]');
  k1G.style.display="none";k2G.style.display="none";
  urlL.textContent="URL";urlI.placeholder="https://...";
  k1L.textContent="参数 1";k2L.textContent="参数 2";
  var show12=[2,4,5,6,8,9,10,11].indexOf(t)>=0;
  if(show12){k1G.style.display="block";k2G.style.display="block"}
  if(t===5){k1L.textContent="Token";k2L.textContent="渠道";k2G.style.display="block"}
  if(t===6){k1L.textContent="SendKey"}
  if(t===10){k1L.textContent="Chat ID";k2L.textContent="Bot Token";k2G.style.display="block"}
  if(t===4||t===8||t===11){k1L.textContent="签名密钥 (可选)"}
  if(t===9){k1L.textContent="Token";urlL.textContent="服务器地址";urlI.placeholder="http://gotify.example.com"}
  if(t===12){urlL.textContent="目标手机号";urlI.placeholder="13800138000";if(!getChVal(i,"url")&&g_adminPhone)setChVal(i,"url",g_adminPhone)}
}

/* --- WiFi --- */
function wifiHtml(e,i){return'<div class="list-item" data-i="'+i+'"><input type="text" id="wSsid'+i+'" value="'+esc(e.ssid)+'" placeholder="SSID" style="flex:1;border:none;background:transparent;padding:4px 0;font-size:13px"><input type="text" id="wPass'+i+'" placeholder="密码" style="width:100px;border:none;background:transparent;padding:4px 0;font-size:13px;text-align:right">'+(g_wifis.length>1?'<button onclick="rmWifi('+i+')">&times;</button>':'')+'</div>'}
function renderWifi(){var c=document.getElementById("wifiList");c.innerHTML="";for(var i=0;i<g_wifis.length;i++)c.insertAdjacentHTML("beforeend",wifiHtml(g_wifis[i],i));document.getElementById("addWifiBtn").disabled=g_wifis.length>=5}
function addWifi(){for(var i=0;i<g_wifis.length;i++)g_wifis[i].ssid=(document.getElementById("wSsid"+i)||{}).value||"";g_wifis.push({ssid:"",password:""});renderWifi()}
function rmWifi(i){if(g_wifis.length<=1)return;g_wifis.splice(i,1);renderWifi()}

/* --- Blacklist --- */
function renderBl(){var c=document.getElementById("blacklistItems");if(!g_bl.length){c.innerHTML='<div class="hint">暂无黑名单号码</div>';return}var h="";for(var i=0;i<g_bl.length;i++)h+='<div class="list-item"><span>'+esc(g_bl[i])+'</span><button onclick="rmBl('+i+')">&times;</button></div>';c.innerHTML=h}
function addBlackNum(){var inp=document.getElementById("newBlNum"),n=inp.value.trim();if(!n)return;if(g_bl.length>=20){showRes("blacklistResult",false,"最多 20 个");return}if(g_bl.indexOf(n)>=0){showRes("blacklistResult",false,"号码已存在");return}g_bl.push(n);inp.value="";renderBl();document.getElementById("blacklistResult").style.display="none"}
function rmBl(i){g_bl.splice(i,1);renderBl()}

/* --- Reboot --- */
function toggleRbMode(){var iv=document.getElementById("rbModeInterval").checked;document.getElementById("rbDailyGroup").style.display=iv?"none":"";document.getElementById("rbIntervalGroup").style.display=iv?"":"none"}

/* --- Load --- */
function loadConfig(){return fetch("/api/config/detail").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){
  g_adminPhone=d.adminPhone||"";g_avail=d.availablePushTypes||null;
  document.getElementById("webUser").value=d.webUser||"";
  document.getElementById("adminPhone").value=d.adminPhone||"";
  document.getElementById("remark").value=d.remark||"";
  document.getElementById("simNotifyEnabled").checked=!!d.simNotifyEnabled;
  document.getElementById("dataTrafficEnabled").checked=!!d.dataTraffic;
  document.getElementById("logFileEnabled").checked=!!d.logFileEnabled;
  var chs=d.pushChannels||[];g_chs=[];
  for(var j=0;j<chs.length;j++)g_chs.push(chs[j]);
  if(!g_chs.length)for(var j=0;j<5;j++)g_chs.push({enabled:false,type:1,name:"",url:"",key1:"",key2:"",customBody:"",retryOnFail:false});
  renderChs();
  var s=d.pushStrategy!==undefined?d.pushStrategy:0;
  var seg=document.getElementById("strategySeg"),labels=seg.querySelectorAll("label"),inputs=seg.querySelectorAll("input");
  for(var r=0;r<inputs.length;r++){var on=parseInt(inputs[r].value)===s;inputs[r].checked=on;labels[r].classList.toggle("act",on)}
  document.getElementById("rbEnabled").checked=!!d.rbEnabled;
  if(d.rbMode===1)document.getElementById("rbModeInterval").checked=true;else document.getElementById("rbModeDaily").checked=true;
  toggleRbMode();
  document.getElementById("rbHour").value=d.rbHour!==undefined?d.rbHour:3;
  document.getElementById("rbMinute").value=d.rbMinute!==undefined?d.rbMinute:0;
  document.getElementById("rbIntervalH").value=d.rbIntervalH!==undefined?d.rbIntervalH:24;
})}
function loadStatus(){return fetch("/api/status").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){document.getElementById("devIp").textContent=d.ip||"--"})}
function loadWifi(){return fetch("/api/wifi").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){g_wifis=d.wifiList&&d.wifiList.length?d.wifiList:[{ssid:"",password:""}];renderWifi()})}
function loadBlacklist(){return fetch("/api/blacklist").then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){g_bl=d.numbers||[];renderBl()})}

function loadAll(){
  document.getElementById("errorBox").style.display="none";
  document.getElementById("loadingMsg").style.display="block";
  loadConfig().then(loadStatus).then(loadWifi).then(loadBlacklist).then(function(){
    document.getElementById("loadingMsg").style.display="none";
  }).catch(function(e){
    document.getElementById("loadingMsg").style.display="none";
    document.getElementById("errorMsg").textContent=e.message.indexOf("HTTP 401")===0?"认证失败，请检查账号密码":"无法加载配置: "+e.message;
    document.getElementById("errorBox").style.display="block";
  });
}

/* --- Save --- */
function saveGeneral(ev){
  ev.preventDefault();
  var btn=document.getElementById("saveBtn"),res=document.getElementById("saveResult");
  btn.disabled=true;btn.textContent="保存中...";res.style.display="none";
  var chs=readChs();
  var fd=new FormData(document.getElementById("configForm"));
  fd.append("pushCount",chs.length);
  for(var i=0;i<chs.length;i++){
    fd.append("push"+i+"en",chs[i].enabled?"1":"");
    fd.append("push"+i+"type",chs[i].type);
    fd.append("push"+i+"name",chs[i].name);
    fd.append("push"+i+"url",chs[i].url);
    fd.append("push"+i+"key1",chs[i].key1);
    fd.append("push"+i+"key2",chs[i].key2);
    fd.append("push"+i+"body",chs[i].customBody);
    fd.append("push"+i+"retry",chs[i].retryOnFail?"1":"");
  }
  fetch("/api/save",{method:"POST",body:fd}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){
    btn.disabled=false;btn.textContent="保存配置";
    showRes("saveResult",!!d.ok,d.ok?(d.message||"保存成功，修改密码后需重新登录"):(d.error||"保存失败"));
  }).catch(function(e){btn.disabled=false;btn.textContent="保存配置";showRes("saveResult",false,"请求失败: "+e.message)});
}

function saveWifi(){
  var list=[];
  for(var i=0;i<g_wifis.length;i++){
    var ssid=(document.getElementById("wSsid"+i)||{}).value||"";
    var pw=(document.getElementById("wPass"+i)||{}).value||"";
    if(ssid.trim())list.push({ssid:ssid.trim(),password:pw});
  }
  if(!list.length){showRes("wifiResult",false,"请至少添加一条 WiFi");return}
  fetch("/api/wifi",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({wifiList:list})}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){
    showRes("wifiResult",!!d.ok,d.ok?(d.message||"已保存，设备将重启"):d.error||"保存失败");
  }).catch(function(e){showRes("wifiResult",false,"请求失败: "+e.message)});
}

function saveBlacklist(){
  fetch("/api/blacklist",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({numbers:g_bl})}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){
    showRes("blacklistResult",!!d.ok,d.ok?"已保存，共 "+d.count+" 条":d.error||"保存失败");
  }).catch(function(e){showRes("blacklistResult",false,"请求失败: "+e.message)});
}

function saveReboot(){
  var btn=document.getElementById("rbSaveBtn");btn.disabled=true;
  var fd=new FormData();
  if(document.getElementById("rbEnabled").checked)fd.append("rbEnabled","on");
  fd.append("rbMode",document.querySelector('input[name="rbMode"]:checked').value);
  fd.append("rbHour",document.getElementById("rbHour").value);
  fd.append("rbMinute",document.getElementById("rbMinute").value);
  fd.append("rbIntervalH",document.getElementById("rbIntervalH").value);
  fetch("/api/reboot",{method:"POST",body:fd}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(d){
    btn.disabled=false;showRes("rbResult",!!d.ok,d.ok?"已保存":d.error||"保存失败");
  }).catch(function(e){btn.disabled=false;showRes("rbResult",false,"请求失败: "+e.message)});
}

document.addEventListener("DOMContentLoaded",loadAll);
</script>
</body>
</html>
