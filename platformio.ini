; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:makergo_esp32c3_supermini]
platform = espressif32
framework = arduino
board = makergo_esp32c3_supermini
board_build.filesystem = littlefs
board_build.variant = super_mini_esp32c3
board_build.variants_dir = custom_variants
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ESP_COREDUMP_ENABLE_TO_FLASH=1
    -D CONFIG_ESP_COREDUMP_DATA_FORMAT_BIN=1
    -Wl,--allow-multiple-definition
    -Os
    ;-D FEATURE_BLUFI=1       ; BluFi BLE 配网（默认关闭，启用=1）
    ;-D FEATURE_CALL=1        ; 来电通知（默认关闭，启用=1）
    ;-D FEATURE_LOG_FILE=1    ; 日志写入文件（默认关闭，启用=1）
    -D FEATURE_COREDUMP=1     ; Coredump 崩溃分析
    ; ── 推送通道开关（默认仅启用 Bark、飞书、SMS）──
    -D FEATURE_PUSH_POST_JSON=1
    -D FEATURE_PUSH_BARK=1
    ;-D FEATURE_PUSH_GET=1
    ;-D FEATURE_PUSH_DINGTALK=1
    ;-D FEATURE_PUSH_PUSHPLUS=1
    ;-D FEATURE_PUSH_SERVERCHAN=1
    ;-D FEATURE_PUSH_CUSTOM=1
    -D FEATURE_PUSH_FEISHU=1
    ;-D FEATURE_PUSH_GOTIFY=1
    ;-D FEATURE_PUSH_TELEGRAM=1
    ;-D FEATURE_PUSH_WECHAT_WORK=1
    -D FEATURE_PUSH_SMS=1
extra_scripts =
    pre:script/inject_app_version.py
    post:script/generate_compilation_database.py
    post:script/upload_littlefs.py
lib_compat_mode = strict
lib_ldf_mode = chain
lib_deps =
    esp32async/ESPAsyncWebServer@^3.10.3
    bblanchon/ArduinoJson@^7.4.0